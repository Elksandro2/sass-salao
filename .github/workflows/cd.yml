name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    outputs:
      repo_lower: ${{ steps.repo.outputs.repo_lower }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepara nome da imagem (lowercase e clean)
        id: repo
        run: |
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=$REPO_LOWER" >> $GITHUB_ENV
          echo "repo_lower=$REPO_LOWER" >> $GITHUB_OUTPUT
          echo "IMAGE=ghcr.io/$REPO_LOWER:latest" >> $GITHUB_ENV

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Unified Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          # A chave pública VAPID tem que ser injetada no BUILD, não no runtime: o Vite embute
          # as variáveis VITE_* no bundle durante o `npm run build`, dentro do Dockerfile.
          # Usa `vars` (variável de repositório), não `secrets`, porque a chave pública não é
          # segredo — vai pro navegador de todo cliente de qualquer jeito, e como `vars` ela
          # fica visível/conferível na UI do GitHub em vez de mascarada nos logs.
          build-args: |
            VITE_VAPID_PUBLIC_KEY=${{ vars.VITE_VAPID_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1

  deploy:
    name: Deploy na VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # A chave usada aqui tem "command=" forçado no authorized_keys do servidor:
          # não importa o que mandarmos, ele só executa
          # "docker compose -f docker-compose.prod.yml pull && ... up -d" no diretório do projeto.
          # Isso é proposital — a chave do CI/CD não tem shell livre no servidor.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"