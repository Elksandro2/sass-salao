spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

mail:
  api-url: ${MAIL_API_URL:https://api.resend.com}
  password: ${MAIL_PASSWORD}
  from: ${MAIL_FROM}
  business: ${MAIL_BUSINESS}

app:
  # Sem default em prod: se FRONTEND_URL não estiver setado, falha no boot em vez de
  # silenciosamente mandar link de localhost em e-mail real.
  frontend-url: ${FRONTEND_URL}
  # Idem para as chaves de cifragem de dados pessoais (CPF, chave PIX): sem default de
  # propósito, a aplicação não sobe em produção se não forem fornecidas.
  pii-encryption-key: ${APP_PII_ENCRYPTION_KEY}
  pii-hash-pepper: ${APP_PII_HASH_PEPPER}

vapid:
  # Gere UMA VEZ com `npx web-push generate-vapid-keys` e nunca regenere: trocar a chave
  # privada invalida TODAS as subscriptions de push já salvas no banco, forçando todo usuário
  # a autorizar notificações de novo.
  public-key: ${VAPID_PUBLIC_KEY}
  private-key: ${VAPID_PRIVATE_KEY}
  subject: ${VAPID_SUBJECT}

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    # 180 dias — equipe fica logada por muito tempo sem precisar refazer login com frequência.
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:15552000000}

ai:
  config-encryption-key: ${AI_CONFIG_ENCRYPTION_KEY}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: INFO
    com.cristiane.salon: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: INFO
