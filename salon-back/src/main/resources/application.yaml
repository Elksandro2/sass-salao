spring:
  application:
    name: salon
  profiles:
    active: dev
  output:
    ansi:
      enabled: always
  # A política de datas fica toda em TimeConfig, com serializadores explícitos por tipo.
  # Não reintroduza spring.jackson.time-zone aqui: um fuso global contradiz a distinção entre
  # hora local do negócio (literal) e instante de máquina (UTC), e foi meio caminho pro bug
  # em que 22h escolhido pela tela aparecia como 19h.

mail:
  api-url: ${MAIL_API_URL:https://api.resend.com}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:dev@localhost.com}
  business: ${MAIL_BUSINESS:salao@localhost.com}

app:
  # Fuso em que o salão opera (ver TimeConfig). É daqui que sai o "hoje"/"agora" de toda regra
  # de negócio — nunca do fuso do sistema operacional, que é UTC de propósito. Assim o mesmo
  # .jar se comporta igual numa VPS em Recife, na Virgínia ou em Frankfurt.
  timezone: ${APP_TIMEZONE:America/Recife}
  # Base do frontend usada para montar links clicáveis em e-mails (ex.: redefinição de
  # senha). Sem isso, o link renderizado num e-mail de produção apontaria pra localhost.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Timeout compartilhado por qualquer chamada HTTP a sistema externo (ver HttpClientConfig).
  # Uma integração nova não precisa configurar o próprio timeout, só usar o RestClient.Builder
  # injetado.
  http-client:
    connect-timeout-ms: ${HTTP_CLIENT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${HTTP_CLIENT_READ_TIMEOUT_MS:5000}
  # Timeout à parte pro provedor de IA — gerar uma resposta de LLM rotineiramente leva vários
  # segundos (mais ainda atravessando um proxy compartilhado, ex.: LiteLLM da turma), um perfil
  # de latência bem diferente de Mercado Pago/Resend. Usar os 5s acima aqui derrubava a chamada
  # antes do provedor terminar de responder (ver HttpClientConfig.aiRestClientBuilder).
  ai-http-client:
    read-timeout-ms: ${AI_HTTP_CLIENT_READ_TIMEOUT_MS:30000}
  # Fila de retry de e-mail (ver EmailOutboxService) — retenção curta de propósito: o registro
  # permanente de todo envio já existe em tb_audit_log, esta tabela é só operacional (o que
  # ainda falta reenviar + histórico recente pra tela de admin), então não faz sentido manter
  # e-mail/corpo de mensagem além do necessário (minimização de dado pessoal, LGPD).
  email-outbox:
    retry-check-interval-ms: ${EMAIL_OUTBOX_RETRY_CHECK_INTERVAL_MS:300000}
    cleanup-cron: ${EMAIL_OUTBOX_CLEANUP_CRON:0 0 3 * * *}
    sent-retention-days: ${EMAIL_OUTBOX_SENT_RETENTION_DAYS:7}
    dead-letter-retention-days: ${EMAIL_OUTBOX_DEAD_LETTER_RETENTION_DAYS:90}
  # Lembrete de agendamento D-1 (issue #111) — roda 09h no fuso America/Recife (não o fuso
  # padrão da JVM, que é UTC).
  appointment-reminder:
    cron: ${APPOINTMENT_REMINDER_CRON:0 0 9 * * *}

# Notificações push via Web Push API (issue #110). As chaves public-key/private-key vivem só
# nos arquivos de perfil (dev/test têm valores reais gerados uma vez; prod exige env var, sem
# default, e NUNCA deve ser regenerada — ver comentário em application-prod.yaml).
vapid:
  subject: ${VAPID_SUBJECT:mailto:admin@salao.com}

logging:
  level:
    root: INFO
    com.cristiane.salon: DEBUG
    org.springframework.security: DEBUG

mercadopago:
  access-token: ${MERCADO_PAGO_ACCESS_TOKEN}
  webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET}
  # Split de pagamento (Fase B/C) — opcionais de propósito: sem eles configurados, o recurso
  # de split simplesmente fica indisponível (cai no fluxo manual já existente), não quebra
  # o resto da aplicação. Só ficam obrigatórios quando alguém tentar conectar uma funcionária.
  client-id: ${MERCADO_PAGO_CLIENT_ID:}
  client-secret: ${MERCADO_PAGO_CLIENT_SECRET:}
  oauth-redirect-uri: ${MERCADO_PAGO_OAUTH_REDIRECT_URI:}
  # Taxa de PIX cobrada pelo MP na conta do salão — confirmar o valor exato no painel dela
  # (Configurações > Taxas) antes de ligar o split de verdade. Usada só pra calcular a
  # comissão fixa do salão sem deixar a funcionária absorver a variação da taxa.
  pix-fee-rate: ${MERCADO_PAGO_PIX_FEE_RATE:0.0099}

# Resilience4j: infraestrutura genérica de resiliência a falha de integração externa.
# "default" é o template — qualquer integração nova só cria uma instance nova referenciando
# base-config: default (herdando timeout/threshold padrão) e, se precisar de comportamento
# diferente (ex.: ignorar um tipo de exceção que é erro de negócio e não falha transitória),
# sobrescreve só o que for diferente. Não é necessário reimplementar circuito/retry a cada
# integração nova.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      mercadopago:
        base-config: default
        # MPApiException = o Mercado Pago respondeu recusando o pagamento (ex.: CPF inválido).
        # Isso é erro de negócio do cliente, não indisponibilidade do gateway — não deve contar
        # como falha para fins de abrir o circuito.
        ignore-exceptions:
          - com.mercadopago.exceptions.MPApiException
      ai-provider:
        base-config: default
        # Resposta do modelo fora do formato esperado é problema de conteúdo, não de rede.
        ignore-exceptions:
          - java.lang.IllegalStateException
      email-provider:
        base-config: default
      mercadopago-oauth:
        base-config: default
        # 4xx do MP (code inválido/expirado, client_secret errado) é erro de configuração ou
        # de fluxo do usuário, não indisponibilidade do gateway — não deve abrir o circuito.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
    instances:
      mercadopago:
        base-config: default
        ignore-exceptions:
          - com.mercadopago.exceptions.MPApiException
      mercadopago-oauth:
        base-config: default
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      ai-provider:
        base-config: default
        ignore-exceptions:
          - java.lang.IllegalStateException
      email-provider:
        base-config: default
